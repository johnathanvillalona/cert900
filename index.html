<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CompTIA Practice Trainer — A+ Core 1, Core 2 & Network+</title>
    <meta name="description" content="Free CompTIA practice exams: A+ Core 1 (220-1201), A+ Core 2 (220-1202), and Network+ (N10-009). Timed simulations, performance-based questions, adaptive drills, and a Professor Messer video for every topic you miss." />
    <meta property="og:title" content="CompTIA Practice Trainer — A+ Core 1, Core 2 & Network+" />
    <meta property="og:description" content="Free practice exams with timed simulations, PBQs, adaptive drills, and per-topic study videos. No sign-up required, progress tracking built in." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>" />
    <script data-boot>
      try {
        var t = localStorage.getItem("trainer-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.classList.toggle("dark", t === "dark");
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
