<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CompTIA Practice Trainer — A+ Core 1, Core 2 & Network+</title>
    <meta name="description" content="Free CompTIA practice exams: A+ Core 1 (220-1201), A+ Core 2 (220-1202), and Network+ (N10-009). Timed simulations, performance-based questions, adaptive drills, and a Professor Messer video for every topic you miss." />
    <meta property="og:title" content="CompTIA Practice Trainer — A+ Core 1, Core 2 & Network+" />
    <meta property="og:description" content="Free practice exams with timed simulations, PBQs, adaptive drills, and per-topic study videos. No sign-up required, progress tracking built in." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cert900.com/" />
    <meta property="og:image" content="https://cert900.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://cert900.com/" />
    <meta name="theme-color" content="#f8fafc" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script data-boot>
      try {
        var t = localStorage.getItem("trainer-theme") || "light";
        document.documentElement.classList.toggle("dark", t === "dark");
        document.documentElement.setAttribute("data-theme", t);
        var tc = document.querySelector('meta[name="theme-color"]');
        if (tc) tc.setAttribute("content", t === "dark" ? "#151b29" : "#f8fafc");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
