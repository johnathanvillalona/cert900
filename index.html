    <!-- Site-wide structured data. Organization + WebSite are valid on every
         page (deduped by @id), so they ride along on the prerendered guide

         per page by tools/prerender.tsx. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://cert900.com/#org",
            "name": "Cert900",

            "name": "Cert900",
            "url": "https://cert900.com/",
            "publisher": { "@id": "https://cert900.com/#org" },
            "inLanguage": "en-US"
          }
        ]
      }
    </script>
    <script data-boot>
      try {
        var t = localStorage.getItem("trainer-theme") || "light";
        document.documentElement.classList.toggle("dark", t === "dark");
        document.documentElement.setAttribute("data-theme", t);
        var tc = document.querySelector('meta[name="theme-color"]');
        if (tc) tc.setAttribute("content", t === "dark" ? "#151b29" : "#f8fafc");
      } catch (e) {}
